# Static hosting for the tddbanking marketing site.
#
# The site is four small files, so it ships as a ConfigMap mounted into
# nginx-unprivileged — no image build, no registry, no pull secret. The
# ConfigMap holding the site itself is generated from the files at deploy time
# by deploy.sh; everything that does not change lives here.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tddbanking-site-nginx
  namespace: cloud-dev
  labels:
    app.kubernetes.io/name: tddbanking-site
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: tddbanking
data:
  default.conf: |
    # nginx only inherits add_header from an outer block when the inner block
    # declares none of its own. Per-location Cache-Control therefore silently
    # drops every server-level security header. Keep add_header at exactly one
    # level and vary the value with a map instead.
    map $uri $tdb_cache_control {
      default      "public, max-age=300";
      ~*\.html$    "no-cache, must-revalidate";
    }

    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      charset utf-8;
      gzip on;
      gzip_types text/css application/javascript image/svg+xml text/plain;
      gzip_min_length 512;

      # Filenames are not content-hashed, so nothing may be cached long enough
      # to outlive a deploy and pair new HTML with old CSS.
      add_header Cache-Control $tdb_cache_control always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options "SAMEORIGIN" always;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tddbanking-site
  namespace: cloud-dev
  labels:
    app.kubernetes.io/name: tddbanking-site
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: tddbanking
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: tddbanking-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tddbanking-site
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: tddbanking
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          volumeMounts:
            - name: static-site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: static-site
          configMap:
            name: tddbanking-site-static
        - name: nginx-config
          configMap:
            name: tddbanking-site-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: tddbanking-site
  namespace: cloud-dev
  labels:
    app.kubernetes.io/name: tddbanking-site
    app.kubernetes.io/part-of: tddbanking
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tddbanking-site
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tddbanking-site
  namespace: cloud-dev
  labels:
    app.kubernetes.io/name: tddbanking-site
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: tddbanking
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: tddbanking.deepspring.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tddbanking-site
                port:
                  name: http
  tls:
    - hosts:
        - tddbanking.deepspring.co
      secretName: wildcard-ds-ssl-secret
